# Grype configuration for the dependency vulnerability scan
# (see .github/workflows/dependency-vulnerability-scan.yml).
#
# This file is the *accepted-risk ledger* for dependency CVEs. An entry here
# suppresses a finding from the report and the SARIF upload. Suppressions are
# only allowed when the risk has been assessed and an expiry is recorded:
#
#   * Every `reason` MUST contain a ticket reference and an expiry date in the
#     form `exp:YYYY-MM-DD`.
#   * Every entry MUST name an `owner` (a person or team) who re-reviews it.
#   * Expired entries are NOT honoured by the Spring advisory check, and the
#     scan job fails when the ledger has expired or unowned entries (see the
#     `--audit-ledger` step in the workflow).
#
# `package.name` is the ARTIFACT name Grype parsed from the SBOM, not the Maven
# coordinate. `tomcat-embed-core` suppresses; `org.apache.tomcat.embed:tomcat-embed-core`
# silently does not — a coordinate here fails open.
#
# Do not add an entry to silence a finding that can be fixed by upgrading a
# version — fix it instead (see docs/security/vulnerability-management.md).
ignore:
  # Accepted risk (temporary): the fixed Tomcat release 11.0.30 is not yet
  # available on Maven Central. Remove this entry and bump the Tomcat pins in
  # pom.xml as soon as 11.0.30 is published.
  - vulnerability: CVE-2026-133325
    package:
      name: tomcat-embed-core
      version: "11.0.29"
    reason: "Vulnerable code path not reachable: no Tomcat cluster or TLS-PSK is configured; fix 11.0.30 unreleased; exp:2026-12-31; see code-scanning alert #29 / GHSA-j322-r8cv-7j54"
    owner: "@qbicsoftware/itss"

  # Example (keep commented until a risk is actually accepted):
  #
  # - vulnerability: CVE-2022-12345
  #   package:
  #     name: some-lib          # ARTIFACT name, not the Maven coordinate
  #     version: "1.2.3"
  #   reason: "Vulnerable code path not reachable; exp:2026-06-30; see issue #1234"
  #   owner: "@qbicsoftware/itss"
