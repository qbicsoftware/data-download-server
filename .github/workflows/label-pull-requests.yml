name: Label Pull Requests

# Read-only by default; the labeler job opts in to pull-requests: write.
permissions:
  contents: read

on:
  pull_request:
    types: [ opened, edited ]

jobs:
  Assign-Label-To-Pull-Request:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
