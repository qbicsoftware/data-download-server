# ###########################################################################################
# Data Download Server - external configuration
# ===========================================================================================
# Place this file next to the packaged JAR (same directory or a `config/` sub-directory).
#
# Spring Boot automatically loads this external file and OVERRIDES the values bundled inside
# the JAR (classpath:application.properties). No application restart code is required beyond
# restarting the service after editing this file.
#
# This file supersedes the previous environment-variable based configuration. All settings are
# documented here with their defaults, so the full service configuration is transparent and
# editable in one place.
#
# NOTE: Values are still overridable by environment variables / command-line args (Spring Boot's
# property precedence), but if you only use this file you can ignore the placeholder syntax.
# ###########################################################################################

# ------------------------------------------------------------------------------------------
# openBIS settings
# ------------------------------------------------------------------------------------------
openbis.user.name=
openbis.user.password=
openbis.server.application.url=
openbis.server.datastore.urls=
openbis.filename.ignored-prefix=${OPENBIS_FILE_IGNORED_PREFIX:original}

# ------------------------------------------------------------------------------------------
# QBiC Identity and Access Management (IAM) database
# ------------------------------------------------------------------------------------------
# The IAM/access-management datasource falls back to the main/spring datasource below when
# these are left empty.
qbic.access-management.datasource.url=
qbic.access-management.datasource.username=
qbic.access-management.datasource.password=
qbic.access-management.datasource.driver-class-name=
# Salt used to derive access tokens, and the number of PBKDF2 iterations.
qbic.access-token.salt=
qbic.access-token.iteration-count=100000

# ------------------------------------------------------------------------------------------
# EHCache used by Spring Security ACL to cache access-control entries
# ------------------------------------------------------------------------------------------
spring.cache.jcache.config=classpath:ehcache3.xml

# ------------------------------------------------------------------------------------------
# Server settings
# ------------------------------------------------------------------------------------------
# HTTP authorization token scheme/name, and the port the service binds (default 8090).
server.download.token-name=Bearer
server.memory.download.buffer=
server.port=8090
server.servlet.context-path=

# ------------------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------------------
logging.level.root=warn
logging.level.org.hibernate=error
logging.file.path=./logs
logging.file.name=${logging.file.path}/${LOG_FILE_NAME:server.log}

# ------------------------------------------------------------------------------------------
# Database / JPA
# ------------------------------------------------------------------------------------------
# Set to true to enable DDL changes in the database (recommended: keep false in production).
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none

# Main datasource
spring.datasource.url=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=
spring.datasource.password=

# Naming strategies (keep as-is unless you know what you are doing)
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------------------
# openAPI / Swagger UI
# ------------------------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
# Empty supported submit methods disables the "Try it out" button
springdoc.swagger-ui.supportedSubmitMethods=[]

# ------------------------------------------------------------------------------------------
# HTTPS behind a proxy
# ------------------------------------------------------------------------------------------
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# ------------------------------------------------------------------------------------------
# Timeouts
# ------------------------------------------------------------------------------------------
# Maximum time a measurement download may run (even while data is being written)
spring.mvc.async.request-timeout=2d
# Session timeout
spring.session.timeout=2d

# ------------------------------------------------------------------------------------------
# Async download thread pool
# ------------------------------------------------------------------------------------------
spring.async.threadpool.core-size=2
spring.async.threadpool.max-size=5
spring.async.threadpool.queue-capacity=2

# ------------------------------------------------------------------------------------------
# Download queue
# ------------------------------------------------------------------------------------------
# Async download queue capacity (number of buffers in the producer-consumer queue).
# Each buffer is downloadBufferSize bytes (default 1MB); total memory per download =
# queue capacity x buffer size. Default 64 buffers = 64MB at default buffer size.
server.download.queue.capacity=64

# Download progress logging interval in ms. Lower = more frequent progress logs.
server.download.progress-log-interval=30000

# Warn when the download queue has fewer than this many free slots left (consumer is not
# keeping up with the producer).
server.download.near-full-queue-left=3

# ------------------------------------------------------------------------------------------
# Storage provider registry (provider abstraction)
# ------------------------------------------------------------------------------------------
# Each configured instance uses a type that selects the implementation and its properties.
#
# OpenBIS provider (DSS HTTP API for metadata + file streaming):
#   providers.instances.openbis-1.type=openbis
#   providers.instances.openbis-1.enabled=true
#   providers.instances.openbis-1.session-timeout=3600
#
# OpenBIS-NFS hybrid provider (openBIS for metadata, mounted NFS via NIO for streaming):
providers.instances.openbis-nfs-1.type=openbis-nfs
providers.instances.openbis-nfs-1.enabled=true
providers.instances.openbis-nfs-1.user.name=
providers.instances.openbis-nfs-1.user.password=
providers.instances.openbis-nfs-1.server.application-url=
providers.instances.openbis-nfs-1.server.datastore-urls=
providers.instances.openbis-nfs-1.filename.wrapper-directory=original
providers.instances.openbis-nfs-1.session-timeout=3600
# MUST be an existing NFS mount point directory on this host; the server fails to start
# if this is not a real directory. Do not leave the placeholder default.
providers.instances.openbis-nfs-1.mount-path=

# Default provider used for datasets that are not otherwise mapped.
providers.default-provider=openbis-nfs-1

